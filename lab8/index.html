<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Loja</title>
  </head>
  <body>
    <header>
      <img src="images/deisi-inverse.svg" alt="DEISI Logo" class="logo-img">
    <h1>DEISI Shop</h1>
      <nav>
        <ul>
          <li><a href="#produtos">Produtos</a></li>
          <li><a href="#cesto">Cesto</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section id="filtros">
        <label for="filtro-categoria">Filtrar por categoria:</label>
        <select id="filtro-categoria">
          <option value="all">Todas as categorias</option>
        </select>

        <label for="ordenar-preco">Ordenar:</label>
        <select id="ordenar-preco">
          <option value="default">Ordenar pelo preço</option>
          <option value="crescente">Preço Crescente</option>
          <option value="decrescente">Preço Descrescente</option>
        </select>

        <label for="pesquisa-produto">Procurar:</label>
        <input
          type="text"
          id="pesquisa-produto"
          placeholder="pesquise por produto"
        />
      </section>
      <section id="produtos"></section>

      <section id="cesto">
        <h2>Cesto</h2>
      <section id="lista-preco"></section>
      <p>Custo Total: <span id="preco-total">0.00</span> €</p>

      <section id="checkout-form">
        <label>
          <input type="checkbox" id="estudante-deisi"> És estudante do DEISI?
        </label>
        <br>
        <label for="cupao-desconto">Cupão de desconto</label>
        <input type="text" id="cupao-desconto">
        <br>
        <button id="btn-comprar">Comprar</button>
      </section>

      <section id="resultado-compra"></section>
      </section>
    </main>

    <footer></footer>
    <script src="script.js"></script>
  </body>
</html>
