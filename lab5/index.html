<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 4 - Eventos JavaScript</title>
    <style>
      #container-flex {
        height: 200px;
        background-color: #e0e0e0;
        display: flex;
        flex-direction: row;
        gap: 10px;
        padding: 10px;
        box-sizing: border-box;
        margin-top: 10px;
        list-style: none; /* Remove os pontos padrão da lista <ul> */
      }

      .bola {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background-color: #3498db;
      }
    </style>
  </head>
  <body>
    <!-- Evento 1: Passar o rato por cima (mouseover / mouseout) -->
    <p id="passa">1. Passa por aqui!</p>

    <!-- Evento 2: Mudar cor do texto ao clicar (click) -->
    <p>
      <span id="texto-pinta">2. Dá-me cor parceiro :-p!</span>
      <button class="color" data-color="red">Red</button>
      <button class="color" data-color="yellow">Yellow</button>
      <button class="color" data-color="black">Black</button>
    </p>

    <!-- Evento 3: Alterar o fundo do input ao escrever/teclar (keydown / keyup) -->
    <p>
      3. Experimenta escrever...
      <input type="text" id="campo-escrita" />
    </p>

    <!-- Evento 4: Mudar a cor de fundo da página via formulário (submit) -->
    <p>
      <label for="select-cor">4. Escolha uma cor: </label>
      <select id="select-cor">
        <option value="White">White</option>
        <option value="Red">Red</option>
        <option value="Blue">Blue</option>
      </select>
    </p>

    <!-- Evento 5: Contador (click) -->
    <p>
      5. <button id="btn-conta">Conta!</button>
      <span id="contador">0</span>
    </p>

    <!-- Evento 6 - onsubmit-->

    <section class="onsubmit">
      <form id="utilizador">
        <label for="nome">6.</label>
        <input id="nome" type="text" placeholder="insira o seu nome" required />
        <input id="idade" type="number" placeholder="idade" required />
        <input type="submit" value="Submit" />
      </form>
      <p id="mensagem-utilizador"></p>
    </section>

    <section class="contador-localStorage">
      <p>
        7. Automatic Counter:
        <span id="automatic-counter">0</span>
      </p>
    </section>

    <section class="exercicio-flex">
      <label for="select-flex">Direção do Flex: </label>
      <select id="select-flex">
        <option value="row">row</option>
        <option value="row-reverse">row-reverse</option>
        <option value="column">line</option>
        <option value="column-reverse">line-reverse</option>
      </select>
      <ul id="container-flex">
        <li class="bola"></li>
        <li class="bola"></li>
        <li class="bola"></li>
        <li class="bola"></li>
      </ul>
    </section>

    <script>
      //1
      const passaTexto = document.querySelector("#passa");
      passaTexto.addEventListener("mouseover", () => {
        passaTexto.textContent = "1. Obrigado por passares!";
      });

      passaTexto.addEventListener("mouseout", () => {
        passaTexto.textContent = "1. Passa por aqui!";
      });

      //2

      document.querySelectorAll("button.color").forEach((botao) => {
        botao.addEventListener("click", () => {
          const cor = botao.dataset.color;
          document.querySelector("#texto-pinta").style.color = cor;
        });
      });

      //3

      const campoEscrita = document.querySelector("#campo-escrita");

      campoEscrita.addEventListener("keyup", () => {
        const r = Math.floor(Math.random() * 256);
        const g = Math.floor(Math.random() * 256);
        const b = Math.floor(Math.random() * 256);

        campoEscrita.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
      });

      //4

      document
        .querySelector("#select-cor")
        .addEventListener("change", function () {
          document.querySelector("body").style.backgroundColor = this.value;
        });
      //5

      const btnConta = document.querySelector("#btn-conta");
      const spanContador = document.querySelector("#contador");

      let valorContador = 0;

      btnConta.addEventListener("click", () => {
        valorContador++;
        spanContador.textContent = valorContador;
      });

      // select-flex

      document
        .querySelector("#select-flex")
        .addEventListener("change", function () {
          document.querySelector("#container-flex").style.flexDirection =
            this.value;
        });

      //6

      document.querySelector("#utilizador").onsubmit = (e) => {
        e.preventDefault();

        const nome = document.querySelector("#nome").value;
        const idade = document.querySelector("#idade").value;

        document.querySelector("#mensagem-utilizador").textContent =
          `Olá, o ${nome} tem ${idade}!`;
      };

      //7

      if (!localStorage.getItem("autoCounter")) {
        localStorage.setItem("autoCounter", 0);
      }

      const spanAutoCounter = document.querySelector("#automatic-counter");

      spanAutoCounter.textContent = localStorage.getItem("autoCounter");

      function incrementarAutomatico() {
        let valorAtual = Number(localStorage.getItem("autoCounter"));
        valorAtual++;

        localStorage.setItem("autoCounter", valorAtual);
        spanAutoCounter.textContent = valorAtual;
      }

      setInterval(incrementarAutomatico, 1000);
    </script>
  </body>
</html>
